[build]

  command = "npm run build"

  publish = "dist"



[build.environment]

  NODE_VERSION = "20"

  # Vite bettet VITE_* in den Client-Build ein — das ist erwartet, kein Leak.
  SECRETS_SCAN_OMIT_KEYS = "VITE_ADMIN_PASSWORD,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"



[functions]

  directory = "netlify/functions"



# Geoapify-Proxy für Scraper

[[redirects]]

  from = "/api/places*"

  to = "/.netlify/functions/places:splat"

  status = 200

  force = true



# SPA fallback

[[redirects]]

  from = "/*"

  to = "/index.html"

  status = 200

