[build]

  command = "npm run build"

  publish = "dist"



[build.environment]

  NODE_VERSION = "20"



[functions]

  directory = "netlify/functions"



# Geoapify-Proxy für Scraper

[[redirects]]

  from = "/api/places*"

  to = "/.netlify/functions/places:splat"

  status = 200

  force = true



# SPA fallback

[[redirects]]

  from = "/*"

  to = "/index.html"

  status = 200

