[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Overpass-Proxy für Scraper (Production)
[[redirects]]
  from = "/api/overpass"
  to = "/.netlify/functions/overpass"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
